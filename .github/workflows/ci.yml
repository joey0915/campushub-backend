name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    outputs:
      jest-outcome: ${{ steps.jest.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Jest test suite
        id: jest
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload Jest failure log
        if: failure() && steps.jest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.log
          retention-days: 7

  # Runs only when the Jest step itself failed (not lint or install), and only
  # for branches of this repository: the job holds a write token.
  auto-fix:
    name: Auto-heal failing tests
    needs: test
    if: >-
      failure() &&
      needs.test.outputs.jest-outcome == 'failure' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !startsWith(github.head_ref || github.ref_name, 'fix/auto-heal-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    env:
      BROKEN_BRANCH: ${{ github.head_ref || github.ref_name }}
      FIX_BRANCH: fix/auto-heal-${{ github.run_id }}
      WORK_DIR: ${{ runner.temp }}/auto-heal
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          # The patched code's tests run below; keep the write token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Jest failure log
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ${{ runner.temp }}/auto-heal

      - name: Collect the breaking diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git diff "origin/$BASE_REF...HEAD" -- src > "$WORK_DIR/diff.patch"
          else
            git diff "$BEFORE_SHA" HEAD -- src > "$WORK_DIR/diff.patch" || : > "$WORK_DIR/diff.patch"
          fi

      - name: Build agent prompt from log and source context
        run: >-
          npx ts-node src/scripts/auto-heal/build-prompt.ts
          "$WORK_DIR/test-results.log" "$WORK_DIR/diff.patch" "$WORK_DIR/prompt.md"

      - name: Ask the AI agent for a patch
        id: agent
        uses: actions/ai-inference@v2.1.1
        with:
          model: openai/gpt-4.1
          system-prompt-file: .github/prompts/auto-heal.system.md
          prompt-file: ${{ runner.temp }}/auto-heal/prompt.md
          max-tokens: 4000
          temperature: 0

      - name: Apply the agent's patch
        env:
          RESPONSE_FILE: ${{ steps.agent.outputs.response-file }}
        run: npx ts-node src/scripts/auto-heal/apply-patch.ts "$RESPONSE_FILE" "$WORK_DIR/summary.md"

      - name: Verify the patch (lint + full Jest suite)
        run: |
          set -o pipefail
          npm run lint
          npm test 2>&1 | tee "$WORK_DIR/verify-results.log"

      - name: Commit the fix and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --name-only | grep -Ev '^src/' | grep -q .; then
            echo "::error::Patch touched files outside src/"; exit 1
          fi
          if git diff --name-only | grep -Eq '(__tests__/|^src/test/|\.test\.ts$)'; then
            echo "::error::Patch touched test files"; exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$FIX_BRANCH"
          git add src
          git commit \
            -m "fix(auto-heal): repair failing Jest suite on $BROKEN_BRANCH" \
            -m "Generated by the auto-fix job in $RUN_URL. Lint and the full Jest suite pass with this patch; it needs human review before merging."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$FIX_BRANCH"

          {
            echo "## What"
            echo "Automated patch from the CI auto-heal agent for the failing Jest suite on \`$BROKEN_BRANCH\` ([workflow run]($RUN_URL))."
            echo
            cat "$WORK_DIR/summary.md"
            echo
            echo "## Verification (in CI, before this PR was opened)"
            echo '```text'
            grep -E '^(Tests|Test Suites):' "$WORK_DIR/verify-results.log"
            echo '```'
            echo
            echo "## Audit Log (human-in-the-loop)"
            echo "_Pending human review. Before merging, confirm that the diff fixes application code"
            echo "rather than test assertions, and record the review here._"
          } > "$WORK_DIR/pr-body.md"

          gh pr create --repo "$REPO" --base "$BROKEN_BRANCH" --head "$FIX_BRANCH" \
            --title "fix(auto-heal): repair failing Jest suite on $BROKEN_BRANCH" \
            --body-file "$WORK_DIR/pr-body.md"
